services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:19003
    volumes:
      - ../:/app
      # ESCUDO DEFINITIVO: Protege a venv interna do container de ser apagada pelo seu computador
      - /app/.venv/
    ports:
      - "19003:19003"
    env_file:
      - ../.env
    depends_on:
      - db
      - redis